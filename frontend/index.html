<!-- frontend/index.html -->
<input type="file" id="f">
<button onclick="go()">upload</button>
<pre id="log"></pre>
<script>
const log = m => document.getElementById('log').textContent += m + "\n";
async function go() {
  const file = document.getElementById('f').files[0];
  if (!file) return log("pick a file first");
  const fd = new FormData(); fd.append("file", file);
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  const { job_id } = await r.json();
  log("job " + job_id);
  const ws = new WebSocket(`ws://${location.host}/ws/${job_id}`);
  ws.onmessage = e => log(e.data);
  ws.onclose = () => log("(socket closed)");
}
</script>

<hr>
<input id="q" placeholder="search the archive">
<button onclick="search()">search</button>
<div id="results"></div>
<audio id="player" controls style="width:100%;margin-top:8px"></audio>
<script>
async function search() {
  const q = document.getElementById('q').value;
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const rows = await r.json();
  const box = document.getElementById('results');
  box.innerHTML = '';
  rows.forEach(x => {
    const div = document.createElement('div');
    div.style.margin = '6px 0';
    const btn = document.createElement('button');
    btn.textContent = '▶ ' + x.start + 's';
    btn.onclick = () => play(x.job_id, x.start);
    div.append(btn, ' ' + x.text);
    box.appendChild(div);
  });
}
async function play(jobId, startSec) {
  const { url } = await (await fetch('/api/audio_url?job_id=' + jobId)).json();
  const player = document.getElementById('player');
  player.src = url;
  player.addEventListener('loadedmetadata', function once() {
    player.removeEventListener('loadedmetadata', once);
    player.currentTime = startSec;
    player.play();
  });
  player.load();
}
</script>
