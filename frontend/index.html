<!-- frontend/index.html -->
<input type="file" id="f">
<button onclick="go()">upload</button>
<pre id="log"></pre>
<script>
const log = m => document.getElementById('log').textContent += m + "\n";
async function go() {
  const file = document.getElementById('f').files[0];
  if (!file) return log("pick a file first");
  const fd = new FormData(); fd.append("file", file);
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  const { job_id } = await r.json();
  log("job " + job_id);
  const ws = new WebSocket(`ws://${location.host}/ws/${job_id}`);
  ws.onmessage = e => log(e.data);
  ws.onclose = () => log("(socket closed)");
}
</script>

<hr>
<input id="q" placeholder="search the archive">
<button onclick="search()">search</button>
<pre id="results"></pre>
<script>
async function search() {
  const q = document.getElementById('q').value;
  const r = await fetch('/api/search?q=' + encodeURIComponent(q));
  const rows = await r.json();
  document.getElementById('results').textContent =
    rows.map(x => `[${x.start}s - ${x.end}s] ${x.text}`).join("\n\n");
}
</script>
